name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # nightly — drives the live (paid) tier

defaults:
  run:
    working-directory: backend

jobs:
  # ── T0: fast unit tier (no external services) ──────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest -m "not infra and not live_nim and not optional" -q

  # ── retrieval eval harness (mock DB, no NIM) ──────────────────────────────────
  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Retrieval eval
        run: pytest tests/retrieval/ -q

  # ── T1: infra tier against real Postgres/Redis/Neo4j ──────────────────────────
  infra:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scylla
          POSTGRES_PASSWORD: scylla
          POSTGRES_DB: nimrouter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scylla -d nimrouter"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://scylla:scylla@localhost:5432/nimrouter
      REDIS_URL: redis://localhost:6379/0
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      JWT_SECRET_KEY: ci-secret
      NVIDIA_API_KEY: ci-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Infra tests
        run: RUN_INFRA=1 pytest -m infra -q

  # ── T2/T3: live tier (paid) — nightly or manual, against a deployed stack ──────
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERIFY_BASE_URL: ${{ secrets.VERIFY_BASE_URL }}
      RUN_LIVE_NIM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Guard — base URL configured
        run: |
          test -n "$VERIFY_BASE_URL" || { echo "VERIFY_BASE_URL secret not set; skipping live tier"; exit 0; }
      - name: Live + optional tiers
        run: pytest -m "live_nim or optional" -q
      - name: Post-deploy smoke
        run: bash scripts/smoke.sh "$VERIFY_BASE_URL"
