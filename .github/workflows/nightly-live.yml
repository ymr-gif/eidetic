# T2/T3: live tier (paid) — nightly or manual, against a deployed stack.
# Split out of ci.yml (2026-07-06) so quota/deploy failures never touch the CI badge.
name: Nightly Live

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

defaults:
  run:
    working-directory: backend

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      VERIFY_BASE_URL: ${{ secrets.VERIFY_BASE_URL }}
      RUN_LIVE_NIM: "1"
      # Seeded-account creds so the live/optional tiers actually run and smoke.sh can
      # log in. conftest skips the WHOLE live/optional tier unless BOTH VERIFY_USER_PW
      # and VERIFY_ADMIN_PW are set; SMOKE_PASS is required by smoke.sh (no default).
      VERIFY_USER_PW: ${{ secrets.VERIFY_USER_PW }}
      VERIFY_ADMIN_PW: ${{ secrets.VERIFY_ADMIN_PW }}
      SMOKE_PASS: ${{ secrets.SMOKE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
      # `exit 0` in a guard step does NOT skip later steps — gate each paid step
      # on the secret instead, so the run stays green when no stack is deployed.
      # The public deployment is invite-gated (REQUIRE_INVITE=true) with web search
      # off, so the full pytest live tier can't self-register throwaway users or fire
      # web_search — it reds the job on ENVIRONMENT MISMATCH, not real regressions.
      # So the AUTHORITATIVE nightly gate is smoke.sh (health -> login -> upload ->
      # chat stream -> metrics), which exercises the real deployment end to end. The
      # pytest live tier still runs for visibility but is NON-BLOCKING until the harness
      # is adapted for an invite-gated stack — see QUEUE.md "Live-suite adaptation for
      # the invite-gated public deployment" for the plan + options.
      - name: Post-deploy smoke (authoritative gate)
        if: env.VERIFY_BASE_URL != ''
        run: bash scripts/smoke.sh "$VERIFY_BASE_URL"
      - name: Live + optional tiers (informational — non-blocking)
        if: env.VERIFY_BASE_URL != ''
        continue-on-error: true
        run: pytest -m "live_nim or optional" -q
      - name: Skipped notice
        if: env.VERIFY_BASE_URL == ''
        run: echo "VERIFY_BASE_URL secret not set — live tier skipped."
