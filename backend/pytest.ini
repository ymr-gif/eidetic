[pytest]
asyncio_mode = auto
testpaths = tests

markers =
    unit: fast, no external deps — the default tier (runs everywhere, incl. CI per-PR)
    infra: needs real Postgres/Redis/Neo4j reachable (opt-in: RUN_INFRA=1)
    live_nim: end-to-end HTTP against a running stack + live model (opt-in: RUN_LIVE_NIM=1, needs VERIFY_BASE_URL reachable)
    optional: gated optional features (OAuth / web-search / OCR / voice / email / push / webhooks) — each test self-skips on missing creds/flags

filterwarnings =
    ignore::DeprecationWarning
