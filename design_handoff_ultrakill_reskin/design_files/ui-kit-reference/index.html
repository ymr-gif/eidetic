<!DOCTYPE html>
<html lang="en" class="crt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIM // SYSTEM TERMINAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
  <link href="../../effects.css?v=2" rel="stylesheet" />
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#000"/>
      <text x="50" y="58" font-family="monospace" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" style="letter-spacing:1px">NIM</text>
      <rect x="28" y="66" width="44" height="4" fill="#ff2222"/>
    </svg>
  </template>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'VT323', monospace; background: #000; color: #fff;
      -webkit-font-smoothing: none; font-smooth: never;
    }

    /* CPU schematic wallpaper behind everything */
    .cpu-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: #000 url('../../assets/cpu-schematic.svg') center center / cover no-repeat;
      opacity: 0.7;
    }
    #root { position: relative; z-index: 1; height: 100%; }

    @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes memFlash{ 0%{background:rgba(61,255,110,0.10)} 100%{background:transparent} }

    .nim-scroll::-webkit-scrollbar       { width: 6px; height: 6px; }
    .nim-scroll::-webkit-scrollbar-track { background: #000; }
    .nim-scroll::-webkit-scrollbar-thumb { background: #4a4a4a; }
    .nim-scroll::-webkit-scrollbar-thumb:hover { background: #ff2222; }
    input:focus, textarea:focus { border-color: #ff2222 !important; box-shadow: 0 0 0 1px rgba(255,34,34,0.4); }
    input[type=range] { accent-color: #ff2222; height: 4px; }
    input[type=checkbox] { accent-color: #ff2222; }
    ::selection { background: #ff2222; color: #000; }

    /* markdown answer body — ULTRAKILL terminal theme */
    .md-body { font-family: 'VT323', monospace; font-size: 18px; line-height: 1.35; color: #c8c8c8; word-break: break-word; }
    .md-body p { margin: 0 0 0.55em; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body h1,.md-body h2,.md-body h3,.md-body h4 { margin:0.7em 0 0.3em; font-weight:700; line-height:1.2; color:#fff; }
    .md-body h1 { font-size:1.3em } .md-body h2 { font-size:1.18em } .md-body h3 { font-size:1.05em }
    .md-body ul,.md-body ol { margin:0.35em 0 0.55em 1.3em; padding:0; }
    .md-body li { margin-bottom:0.15em; }
    .md-body li::marker { color:#ff2222; }
    .md-body code { background:#050505; border:1px solid #262626; padding:0 0.35em; font-family:'VT323',monospace; font-size:0.95em; color:#27d8ff; }
    .md-body pre { background:#000; border:1px solid #262626; border-left:2px solid #4a4a4a; padding:0.6em 0.9em; overflow-x:auto; margin:0.5em 0; }
    .md-body pre code { background:none; border:none; padding:0; color:#8f8f8f; }
    .md-body blockquote { border-left:2px solid #ff2222; margin:0.5em 0; padding:0.1em 0.7em; color:#8f8f8f; }
    .md-body a { color:#27d8ff; text-decoration:underline; }
    .md-body strong { color:#fff; font-weight:700; }
    .md-body em { color:#c8c8c8; }
    .md-body hr { border:none; border-top:1px solid #262626; margin:0.7em 0; }
  </style>
</head>
<body class="crt nim-body">
  <div class="cpu-bg"></div>
  <div id="root"></div>

  <!-- CRT overlay stack (always on top) -->
  <div class="crt-grille"></div>
  <div class="crt-scanlines"></div>
  <div class="crt-beam"></div>
  <div class="crt-vignette"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="styles.js"></script>
  <script src="data.js"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="feed.jsx"></script>
  <script type="text/babel" src="panels.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
