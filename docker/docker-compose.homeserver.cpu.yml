# CPU validation override for the home-server serving stack.
#
# Purpose: retire the highest-risk Q1 gate — "do `tool_calls` work with the
# Mixtral GGUF chat template?" — WITHOUT the 2×P40 box. The chat-template /
# OpenAI tool-call behaviour is a property of llama.cpp + the model template,
# not the GPU, so a small Mistral-family GGUF on CPU validates it faithfully.
# (Mistral-7B-Instruct shares the v3 tool-calling template family with Mixtral.)
#
# Usage:
#   1. Put a small GGUF in backend/storage/models/, e.g.
#      mistral-7b-instruct-v0.3.Q4_K_M.gguf
#   2. Supply a TOOL-AWARE chat template (see caveat below) into models/:
#      curl -fsS https://huggingface.co/mistralai/Mistral-7B-Instruct-v0.3/raw/main/tokenizer_config.json \
#        | python3 -c 'import json,sys;print(json.load(sys.stdin)["chat_template"])' \
#        > backend/storage/models/mistral-v3-tool.jinja
#   3. docker compose -f docker-compose.yml -f docker-compose.homeserver.cpu.yml \
#        --profile homeserver up -d llamacpp
#   4. Probe tool_calls (no GPU needed):  ./probe_tool_calls.sh
#      (CPU warmup is slow — ~5 min for a 7B Q4 on this box; use WAIT=360.)
#      → exit 0 / non-null tool_calls array = gate PASSED (server emits OpenAI tool calls).
#      → exit 1 / prose-only = gate FAILED → prompt-based tool fallback (BUGS Q-A2).
#   5. Repoint the API at it to run the real agent loop end-to-end:
#      NIM_URL=http://llamacpp:8080/v1/chat/completions
#
# ⚑ CAVEAT (verified 2026-06-18): `--jinja` alone is NOT enough. It emits tool_calls
#   from the model's *embedded* chat template — and many GGUFs (e.g. bartowski
#   Mistral-7B-v0.3) ship only the basic `[INST]…[/INST]` template with NO tool
#   branch, so the probe FAILs as prose. Supplying the official tool-aware template
#   via `--chat-template-file` flips it to PASS (get_weather + {"city":"Paris"}).
#   → Always verify the SERVED Mixtral GGUF's embedded template, and if it lacks
#     tools, hand llama.cpp a tool-aware `.jinja` (same as below). This applies to
#     the GPU base service too.
#
# This override drops the GPU image + reservation and loads a CPU model.

services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/${LLAMACPP_CPU_MODEL:-mistral-7b-instruct-v0.3.Q4_K_M.gguf}
      --alias mixtral
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMACPP_CPU_CTX:-8192}
      --jinja
      --chat-template-file /models/${LLAMACPP_CHAT_TEMPLATE:-mistral-v3-tool.jinja}
      --parallel 1
    deploy:
      resources:
        reservations:
          devices: !reset []   # clear the base GPU reservation (Compose merge directive)

  # Embeddings can also be validated CPU-side if you have a bge GGUF handy.
  llamacpp-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/${EMBED_MODEL:-bge-large-en-v1.5-q8_0.gguf}
      --alias bge-large-en-v1.5
      --host 0.0.0.0 --port 8081
      --embeddings
      --pooling ${EMBED_POOLING:-cls}
      --ctx-size 512
    deploy:
      resources:
        reservations:
          devices: !reset []   # clear the base GPU reservation (Compose merge directive)
