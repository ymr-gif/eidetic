# CPU validation override for the home-server serving stack.
#
# Purpose: retire the highest-risk Q1 gate — "do `tool_calls` work with the
# Mixtral GGUF chat template?" — WITHOUT the 2×P40 box. The chat-template /
# OpenAI tool-call behaviour is a property of llama.cpp + the model template,
# not the GPU, so a small Mistral-family GGUF on CPU validates it faithfully.
# (Mistral-7B-Instruct shares the v3 tool-calling template family with Mixtral.)
#
# Usage:
#   1. Put a small GGUF in backend/storage/models/, e.g.
#      mistral-7b-instruct-v0.3.Q4_K_M.gguf
#   2. docker compose -f docker-compose.yml -f docker-compose.homeserver.cpu.yml \
#        --profile homeserver up -d llamacpp
#   3. Probe tool_calls (no GPU needed):
#      curl -s http://localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d '{
#        "model":"mixtral","messages":[{"role":"user","content":"What is the weather in Paris? Use the tool."}],
#        "tools":[{"type":"function","function":{"name":"get_weather",
#          "parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}],
#        "tool_choice":"auto"}' | jq '.choices[0].message.tool_calls'
#      → a non-null tool_calls array = gate PASSED (the GGUF emits OpenAI tool calls).
#      → null / prose-only = gate FAILED → prompt-based tool fallback (BUGS Q-A2).
#   4. Repoint the API at it to run the real agent loop end-to-end:
#      NIM_URL=http://llamacpp:8080/v1/chat/completions
#
# This override drops the GPU image + reservation and loads a CPU model.

services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/${LLAMACPP_CPU_MODEL:-mistral-7b-instruct-v0.3.Q4_K_M.gguf}
      --alias mixtral
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMACPP_CPU_CTX:-8192}
      --jinja
      --parallel 1
    deploy:
      resources:
        reservations:
          devices: !reset []   # clear the base GPU reservation (Compose merge directive)

  # Embeddings can also be validated CPU-side if you have a bge GGUF handy.
  llamacpp-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/${EMBED_MODEL:-bge-large-en-v1.5-q8_0.gguf}
      --alias bge-large-en-v1.5
      --host 0.0.0.0 --port 8081
      --embeddings
      --pooling ${EMBED_POOLING:-cls}
      --ctx-size 512
    deploy:
      resources:
        reservations:
          devices: !reset []   # clear the base GPU reservation (Compose merge directive)
