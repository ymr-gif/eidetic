# Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required env vars (no defaults in prod):
#   POSTGRES_PASSWORD, GRAFANA_ADMIN_PASSWORD, NIM_API_KEY, SECRET_KEY
#
# Firewall: block host ports 8000, 9090, 5432, 3001 — expose only 80 and 443.

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - frontend
    restart: always
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  api:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 512M

  redis:
    restart: always
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  metrics-worker:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  prometheus:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  redisdata:
