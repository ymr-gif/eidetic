services:

  # ── API (horizontal scaling) ─────────────────────────────────────────────
  # Scale freely: `docker compose up -d --scale api=N` (N = replica count).
  # JWT is stateless, SSE is per-request — no sticky sessions needed.
  # Frontend nginx uses `resolver 127.0.0.11` + variable proxy_pass, so it
  # dynamically resolves all API replicas via Docker DNS (no config change).
  # In prod (nginx.prod.conf), the upstream uses `server api:8000 resolve;`
  # with the same DNS resolver for dynamic load balancing.
  # WARNING: `ports: 8000:8000` conflicts when scaling — each replica beyond
  # the first gets a random host port. For clean multi-replica dev, omit the
  # port mapping (the frontend nginx still reaches every replica internally).
  # ──────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    init: true
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@pgbouncer:5432/${POSTGRES_DB:-nimrouter}
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom_multiproc
      # Web search is opt-in: it needs the searxng backend, which is profile-gated.
      # Enable BOTH together, e.g.:
      #   WEB_SEARCH_ENABLED=true docker compose --profile web-search up -d searxng api
      WEB_SEARCH_ENABLED: "${WEB_SEARCH_ENABLED:-false}"
    ports:
      - "8000:8000"
    volumes:
      - ../backend/storage:/app/backend/storage
    tmpfs:
      - /tmp/prom_multiproc
    networks:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - backend

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: ${POSTGRES_USER:-scylla}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scylla}
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-nimrouter}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scylla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scylla}
      POSTGRES_DB: ${POSTGRES_DB:-nimrouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scylla} -d ${POSTGRES_DB:-nimrouter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  arq-worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: python -m arq services.arq_worker.WorkerSettings
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@pgbouncer:5432/${POSTGRES_DB:-nimrouter}
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../backend/storage:/app/backend/storage
    networks:
      - backend

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - backend

  metrics-worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: python -m observability.metrics_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - backend

  # ⚠️  SINGLETON — do NOT scale this service.
  # The scheduler runs APScheduler jobs (daily compaction, backup, 6h integration
  # sync, scheduled prompts, digest). Replicating it = duplicate backups, emails,
  # NIM calls, and DB writes. It has NO built-in leader election.
  # Never use `--scale scheduler=N` or `deploy.replicas > 1`.
  scheduler:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: python -m services.scheduler_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@pgbouncer:5432/${POSTGRES_DB:-nimrouter}
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
    depends_on:
      pgbouncer:
        condition: service_started
      neo4j:
        condition: service_healthy
    volumes:
      - ../backend/storage:/app/backend/storage
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_FEATURE_TOGGLES_ENABLE: ""
      POSTGRES_USER: ${POSTGRES_USER:-scylla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scylla}
      POSTGRES_DB: ${POSTGRES_DB:-nimrouter}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped
    networks:
      - backend

  searxng:
    image: searxng/searxng:latest
    profiles: [web-search]
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_SECRET=changeme-replace-in-prod
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - backend

  # ── APIRouter workers (queue-pulling, scale freely) ───────────────────────
  # ARQ workers pull jobs from Redis. Multiple workers = more throughput.
  # Safe to scale with `--scale arq-worker=N`. No singleton concerns — ARQ
  # guarantees each job runs exactly once (reserved until ack/complete).
  # ──────────────────────────────────────────────────────────────────────────

  # ── Home-server model serving (Q1 — llama.cpp/GGUF) ──────────────────────────
  # Opt-in only: `docker compose --profile homeserver up -d`. NOT started by the
  # default stack, so the live NIM backend is untouched until you repoint NIM_URL.
  # Drop GGUF weights into backend/storage/models/ first. On the home server the
  # GPU reservation needs the nvidia container runtime configured on the host.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [homeserver]
    restart: unless-stopped
    # tool_calls gate (verified 2026-06-18, CPU): `--jinja` emits OpenAI tool_calls
    # ONLY if the served GGUF's embedded chat template has a tool branch. If the
    # probe (docker/probe_tool_calls.sh) FAILs as prose, the GGUF ships a basic
    # template — hand llama.cpp a tool-aware one by adding to the command below:
    #   --chat-template-file /models/<tool-template>.jinja
    # (see docker-compose.homeserver.cpu.yml header for fetching the Mistral template).
    command: >
      --model /models/${LLAMACPP_MODEL:-mixtral-8x7b-instruct-v0.1.Q4_K_M.gguf}
      --alias mixtral
      --host 0.0.0.0 --port 8080
      --ctx-size ${LLAMACPP_CTX:-32768}
      --n-gpu-layers ${LLAMACPP_NGL:-999}
      --cache-type-k q4_0 --cache-type-v q4_0
      --flash-attn
      --jinja
      --parallel ${LLAMACPP_PARALLEL:-2}
    volumes:
      - ../backend/storage/models:/models:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - backend

  llamacpp-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: [homeserver]
    restart: unless-stopped
    command: >
      --model /models/${EMBED_MODEL:-bge-large-en-v1.5-q8_0.gguf}
      --alias bge-large-en-v1.5
      --host 0.0.0.0 --port 8081
      --embeddings
      --pooling ${EMBED_POOLING:-cls}
      --ctx-size 512
      --n-gpu-layers ${EMBED_NGL:-999}
    volumes:
      - ../backend/storage/models:/models:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - backend

volumes:
  pgdata:
  neo4jdata:
  prometheusdata:

networks:
  backend:
    driver: bridge
