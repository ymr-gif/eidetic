services:

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@postgres:5432/${POSTGRES_DB:-nimrouter}
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ../backend/storage:/app/backend/storage
    networks:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scylla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scylla}
      POSTGRES_DB: ${POSTGRES_DB:-nimrouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scylla} -d ${POSTGRES_DB:-nimrouter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  metrics-worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: python -m observability.metrics_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      - backend

  scheduler:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    command: python -m services.scheduler_worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scylla}:${POSTGRES_PASSWORD:-scylla}@postgres:5432/${POSTGRES_DB:-nimrouter}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/storage:/app/backend/storage
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: ""
      POSTGRES_USER: ${POSTGRES_USER:-scylla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scylla}
      POSTGRES_DB: ${POSTGRES_DB:-nimrouter}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
