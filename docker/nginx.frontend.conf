server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;
    set $upstream api;

    # Unknown paths get a real 404, not the app shell. `=404` (not the usual SPA
    # `/index.html` fallback) is what makes the status honest; `error_page` then
    # swaps in the styled page while PRESERVING the 404 — note there is no `=` in
    # `error_page 404 /404.html`, which is the difference between returning 404
    # and silently returning 200. `/` still serves index.html via `index` above.
    #
    # ⚑ TRADE-OFF — safe ONLY because this app has no client-side routing.
    # There is exactly one valid path (`/`), so nothing legitimate can 404 here.
    # If a router is ever added, every deep link (`/settings`, `/c/<id>`, ...)
    # will 404 until this line goes back to a `/index.html` fallback. The in-app
    # pathname guard in App.jsx is a backstop for whatever slips past nginx — it
    # is NOT a reason to skip revisiting this line.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
